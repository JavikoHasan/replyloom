name: Validate Cell Phone Store Worker diagnostics

on:
  pull_request:
    branches:
      - adaptacion-cell-phone-store
    paths:
      - "apps/worker/**"
      - "packages/db/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  validate-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint Worker
        run: pnpm --filter worker lint
      - name: Typecheck Worker
        run: pnpm --filter worker typecheck
      - name: Test Worker
        run: pnpm --filter worker test
