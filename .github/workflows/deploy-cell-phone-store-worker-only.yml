name: Deploy Cell Phone Store Worker only

on:
  push:
    branches:
      - adaptacion-cell-phone-store

permissions:
  contents: read

concurrency:
  group: cell-phone-store-worker-only
  cancel-in-progress: true

jobs:
  deploy-worker:
    # A normal code commit must explicitly opt into deployment. This lets
    # workflow changes and intermediate commits land without touching prod.
    if: contains(github.event.head_commit.message, '[worker-deploy]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Resolve only the existing Cell Phone Store resources. This does not
      # create resources, alter secrets, run D1 migrations, or touch apps/web.
      - name: Render Worker config from existing Cloudflare resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          async function get(path) {
            const response = await fetch('https://api.cloudflare.com/client/v4' + path, {
              headers: { Authorization: 'Bearer ' + token },
            });
            const payload = await response.json();
            if (!response.ok || !payload.success) {
              throw new Error('Cloudflare resource lookup failed (HTTP ' + response.status + ')');
            }
            return payload.result ?? [];
          }

          const [databases, namespaces] = await Promise.all([
            get('/accounts/' + account + '/d1/database?page=1&per_page=100'),
            get('/accounts/' + account + '/storage/kv/namespaces?page=1&per_page=1000'),
          ]);
          const database = databases.find((item) => item.name === 'cell-phone-store-whatsapp-ai-db');
          const reply = namespaces.find((item) => item.title === 'cell-phone-store-reply-cache');
          const media = namespaces.find((item) => item.title === 'cell-phone-store-media-store');
          if (!database?.uuid || !reply?.id || !media?.id) {
            throw new Error('The existing Cell Phone Store D1/KV resources could not all be found; no deployment was attempted.');
          }

          const path = 'apps/worker/wrangler.jsonc';
          let config = fs.readFileSync(path, 'utf8');
          const original = config;
          config = config.replace(/("database_id"\s*:\s*)"[^"]+"/, (_m, prefix) => prefix + JSON.stringify(database.uuid));
          config = config.replace(/("binding"\s*:\s*"REPLY_CACHE"\s*,\s*"id"\s*:\s*)"[^"]+"/, (_m, prefix) => prefix + JSON.stringify(reply.id));
          config = config.replace(/("binding"\s*:\s*"MEDIA_STORE"\s*,\s*"id"\s*:\s*)"[^"]+"/, (_m, prefix) => prefix + JSON.stringify(media.id));
          if (config === original || config.includes('REPLACE_WITH_')) {
            throw new Error('Worker config still contains unresolved resource placeholders.');
          }
          fs.writeFileSync(path, config);
          console.log('Resolved the existing Cell Phone Store Worker resources.');
          NODE

      - name: Generate Worker types
        run: pnpm --filter web --filter worker cf-typegen:ci

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test Worker
        run: pnpm --filter worker test

      - name: Test web compatibility
        run: pnpm --filter web test

      - name: Build Worker
        run: pnpm --filter worker build

      - name: Verify isolated production target
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = fs.readFileSync('apps/worker/wrangler.jsonc', 'utf8');
          if (!/"name"\s*:\s*"cell-phone-store-whatsapp-ai"/.test(config)) {
            throw new Error('Refusing deployment: Worker name is not cell-phone-store-whatsapp-ai.');
          }
          if (config.includes('REPLACE_WITH_')) {
            throw new Error('Refusing deployment: unresolved Cloudflare resource IDs remain.');
          }
          for (const binding of ['REPLY_CACHE', 'MEDIA_STORE', 'DB', 'WHATSAPP_SESSION']) {
            if (!config.includes('"' + binding + '"')) throw new Error('Missing required binding: ' + binding);
          }
          console.log('Confirmed isolated target: cell-phone-store-whatsapp-ai.');
          NODE

      # This deploys only cell-phone-store-whatsapp-ai. It intentionally does
      # not run D1 migrations, deploy the CRM web Worker, or rewrite secrets.
      - name: Deploy WhatsApp Worker only
        working-directory: apps/worker
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
