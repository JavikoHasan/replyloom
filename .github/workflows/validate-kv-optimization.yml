name: Validate isolated KV optimization

on:
  push:
    branches:
      - fix/kv-write-optimization

permissions:
  contents: read

concurrency:
  group: kv-optimization-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Cloudflare types
        run: pnpm --filter web --filter worker cf-typegen:ci
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test worker
        run: pnpm --filter worker test
      - name: Test web
        run: pnpm --filter web test
      - name: Build
        run: pnpm build
