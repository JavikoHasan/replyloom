name: Deploy Cell Phone Store WhatsApp AI

on:
  workflow_dispatch:
  push:
    branches: [adaptacion-cell-phone-store]

permissions:
  contents: read

concurrency:
  group: cell-phone-store-cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Validate, provision and deploy
    if: github.ref == 'refs/heads/adaptacion-cell-phone-store'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Verify Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to this repository's GitHub Actions secrets. No deployment was attempted."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Cloudflare types
        run: pnpm --filter web --filter worker cf-typegen:ci

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test worker
        run: pnpm --filter worker test

      - name: Test web
        run: pnpm --filter web test

      - name: Check Baileys patches
        run: bash scripts/check-patches.sh

      - name: Build
        run: pnpm build

      # This script is idempotent: it reuses resources with the configured
      # names, creates missing D1/KV/Queue resources, applies migrations,
      # and generates the three required application secrets.
      - name: Provision Cloudflare resources
        run: pnpm setup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set production URLs
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const app = 'https://whatsapp-ai-web.elprincipiante.workers.dev';
          const engine = 'https://cell-phone-store-whatsapp-ai.elprincipiante.workers.dev';
          const webPath = 'apps/web/wrangler.jsonc';
          const workerPath = 'apps/worker/wrangler.jsonc';
          let web = fs.readFileSync(webPath, 'utf8');
          let worker = fs.readFileSync(workerPath, 'utf8');
          web = web.replace(/("BETTER_AUTH_URL": *)"[^"]*"/, `$1"${app}"`);
          web = web.replace(/("VITE_ENGINE_URL": *)"[^"]*"/, `$1"${engine}"`);
          worker = worker.replace(/("CORS_ORIGIN": *)"[^"]*"/, `$1"${app}"`);
          fs.writeFileSync(webPath, web);
          fs.writeFileSync(workerPath, worker);
          fs.writeFileSync('apps/web/.env.production',
            `VITE_ENGINE_URL=${engine}\nVITE_WA_API_URL=${engine}\nVITE_SENTRY_DSN=\n`);
          NODE
          node scripts/config.mjs --check

      - name: Build production assets
        run: pnpm build

      - name: Apply database migrations
        working-directory: apps/worker
        run: CI=true pnpm exec wrangler d1 migrations apply cell-phone-store-whatsapp-ai-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy WhatsApp engine
        working-directory: apps/worker
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy CRM web app
        working-directory: apps/web
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
